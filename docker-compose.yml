services:
  # Development service - accessible at http://localhost:3001
  xgen-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: xgen-mrp-dev
    working_dir: /app
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - xgen_network

  # Production service - accessible at http://localhost:3002
  xgen-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xgen-mrp-prod
    working_dir: /app
    ports:
      - '3002:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    networks:
      - xgen_network
    depends_on:
      - xgen-dev

networks:
  xgen_network:
    driver: bridge